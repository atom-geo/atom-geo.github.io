project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd

website:
  title: "Atom Rosales"
  site-url: "https://atom-geo.github.io"
  description: "Spatial data science, GIS, and operational analytics for integrated pest management and public health."
  search: false
  open-graph:
    site-name: "Atom Rosales"
    locale: en_US
    image: assets/social/atom-rosales-social.png
  twitter-card:
    card-style: summary_large_image
    image: assets/social/atom-rosales-social.png
  navbar:
    background: light
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/atom-geo
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/atom-rosales-659754380/
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Atom Rosales"
    right: "Built with Quarto and GitHub Pages"

format:
  html:
    theme:
      - spacelab
      - assets/css/styles.scss
    toc: false
    code-fold: false
    code-tools: false
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    fig-cap-location: bottom
