project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
  resources:
    - assets/

website:
  title: "Atom Rosales"
  site-url: "https://atom-geo.github.io"
  description: "Spatial data science, GIS, and operational analytics for integrated pest management and public health."
  search: false
  open-graph:
    site-name: "Atom Rosales"
    locale: en_US
    image: assets/social/atom-rosales-social.png
  twitter-card:
    card-style: summary_large_image
    image: assets/social/atom-rosales-social.png
  navbar: false

format:
  html:
    theme: none
    page-layout: custom
    css:
      - assets/vendor/leaflet/leaflet.css
      - assets/css/styles.css
    include-in-header: assets/includes/scripts.html
    include-before-body: assets/includes/header.html
    include-after-body: assets/includes/footer.html
    toc: false
    code-fold: false
    code-tools: false
    smooth-scroll: false
    anchor-sections: false
    link-external-newwindow: true
    fig-cap-location: bottom
